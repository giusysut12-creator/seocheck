project_id = "rankpilot"

[api]
enabled = true
port = 54321

[db]
port = 54322

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5173"]
jwt_expiry = 3600
enable_signup = true

[auth.email]
enable_signup = true
enable_confirmations = false

[functions.crawl-site]
verify_jwt = false

[functions.seo-provider-proxy]
verify_jwt = false

[functions.ai-assistant]
verify_jwt = false

[functions.google-search-console]
verify_jwt = false

# Google redirects a browser here after consent, with no Authorization header,
# so JWT verification must stay off. The function trusts only the one-time
# state row it looks up itself.
[functions.google-oauth-callback]
verify_jwt = false

[functions.google-ads]
verify_jwt = false
